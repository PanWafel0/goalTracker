spring.application.name=goaltracker
# H2 w trybie plikowym - dane przetrwają restart
spring.datasource.url=jdbc:h2:file:./data/goaltracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tworzy/aktualizuje tabele automatycznie
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Konsola H2 w przeglądarce
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console